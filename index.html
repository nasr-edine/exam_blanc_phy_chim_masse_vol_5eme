<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen blanc : Physique-Chimie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9ff;--ink:#1f2350;--card:#fff;--line:#d3def5;--mut:#5b6190;--acc:#4b3fd6;--onacc:#fff;--ok:#1a8a5a;--ko:#c93a4f;--wn:#d9822b;--mg:#e8708a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--ink:#e6e9ff;--card:#1b1e3d;--line:#2b3060;--mut:#9aa1d6;--acc:#9d93ff;--onacc:#14163a;--ok:#4cd493;--ko:#ff7d90;--wn:#f0a458;--mg:#b4506a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142b;--ink:#e6e9ff;--card:#1b1e3d;--line:#2b3060;--mut:#9aa1d6;--acc:#9d93ff;--onacc:#14163a;--ok:#4cd493;--ko:#ff7d90;--wn:#f0a458;--mg:#b4506a;color-scheme:dark}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque",Nunito,sans-serif;margin:0;line-height:1.15}
main{max-width:740px;margin:0 auto;padding:20px 18px 80px 34px;border-left:2px solid var(--mg);min-height:100vh}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 22px;background:var(--acc);color:var(--onacc);cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--wn);outline-offset:2px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px}
#clk{font:800 28px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
#clk.w{color:var(--ko)}
.sm{color:var(--mut);font-size:14px}
.pt{background:var(--acc);color:var(--onacc);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0}
.q .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:800}
.q.good{border-left:6px solid var(--ok)}.q.mid{border-left:6px solid var(--wn)}.q.bad{border-left:6px solid var(--ko)}
.opt{display:block;padding:9px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:9px;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.opt input{margin-right:8px;accent-color:var(--acc)}
select,input[type=text]{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input[type=text]{width:130px}
.it{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.it>span{min-width:130px;font-weight:600}
svg{max-width:100%;height:auto}
sup,sub{font-size:.7em}
.ex{color:var(--mut);font-size:15px;margin-top:6px}
.big{font:800 64px "Bricolage Grotesque",sans-serif;color:var(--acc);line-height:1}
.bar2{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 2px}
.bar2 b{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:800}
#msg{color:var(--wn);font-weight:800;margin:10px 0}
ul{padding-left:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const R=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const dec=v=>String(v).replace(".",",");
const C=(part,pts,html,ok,bad,expl)=>{const o=sh([ok,...bad]);return{part,pts,html,t:"c",opts:o,ans:o.indexOf(ok),show:ok,expl}};
const S=(part,pts,html,items,opts,expl)=>({part,pts,html,t:"s",items,opts,expl});
const N=(part,pts,html,val,show,expl)=>({part,pts,html,t:"n",val,show,expl});
const A=(part,pts,html,val,u,expl)=>({part,pts,html,t:"a",val,u,show:`${dec(val)} ${u}`,expl});
const PARTS=["Connaissances et définitions","Lecture de graduation et ménisque","Volume par déplacement d’eau","Masse et volume dans la vie courante","Changements d’état"];
const TIPS=[
"Grandeur physique : caractéristique que l’on peut mesurer. Masse : quantité de matière (balance ; mg, g, kg). Volume : place occupée (éprouvette graduée ; mL, cL, L).",
"Place l’œil à la hauteur de la surface du liquide et lis au bas du ménisque. Valeur d’une division = (grande graduation − petite graduation) ÷ nombre d’intervalles.",
"Méthode du déplacement d’eau : V<sub>objet</sub> = V<sub>final</sub> − V<sub>initial</sub>. N’oublie pas l’unité (mL).",
"Un verre mesure un volume, pas une masse : 150 mL d’ingrédients différents n’ont pas la même masse. Le volume et la masse sont deux grandeurs différentes.",
"Les 6 changements d’état : fusion, solidification, vaporisation, liquéfaction, sublimation, condensation. Le « brouillard » au-dessus d’une poêle est de l’eau liquide (gouttelettes), pas un gaz."];
const MEN=s=>s>=16?"Très bien 🎉":s>=14?"Bien 👏":s>=12?"Assez bien 👍":s>=10?"Passable : tu y es presque":"À retravailler, mais tu vas progresser";
function epr(Lo,st,k){
 const y=v=>230-(v-Lo)/(2*st)*200,lv=Lo+st+k*st/10,yl=y(lv);let t="";
 for(let i=0;i<=20;i++){const yy=y(Lo+i*st/10),L=i%10==0;t+=`<path d="M130 ${yy}h${L?24:12}" style="stroke:var(--ink)" stroke-width="${L?2:1}"/>`+(L?`<text x="160" y="${yy+5}" font-size="14" font-weight="800" style="fill:var(--ink)">${Lo+i*st/10}</text>`:"")}
 return {v:lv,svg:`<svg viewBox="0 0 230 250" width="100%" style="max-width:240px;display:block;margin:8px 0" role="img" aria-label="Éprouvette graduée"><path d="M80 ${yl-5}Q105 ${yl+5} 130 ${yl-5}V230H80Z" fill="#4aa8e8" opacity=".75"/><rect x="80" y="28" width="50" height="204" rx="3" fill="none" style="stroke:var(--ink)" stroke-width="2"/>${t}<text x="167" y="236" font-size="12" style="fill:var(--mut)">mL</text></svg>`}
}
function gen(){
 const q=[];
 q.push(C(0,1,"Une grandeur physique est :","une caractéristique d’un objet ou d’un phénomène que l’on peut mesurer",["un objet que l’on peut peser","une unité de mesure","une couleur ou une odeur"],"Exemples : masse, volume, température, longueur, temps."));
 q.push(S(0,1,"Pour chaque définition, dis s’il s’agit de la masse ou du volume.",[{l:"Quantité de matière contenue dans un objet",c:"Masse"},{l:"Place qu’occupe un objet",c:"Volume"}],["Masse","Volume"],"Masse : quantité de matière. Volume : place occupée."));
 const P=[["le gramme (g)","Masse"],["le kilogramme (kg)","Masse"],["le milligramme (mg)","Masse"],["la balance","Masse"],["le millilitre (mL)","Volume"],["le litre (L)","Volume"],["le centilitre (cL)","Volume"],["l’éprouvette graduée","Volume"]];
 const ms=sh(P.filter(p=>p[1]=="Masse")).slice(0,2),vs=sh(P.filter(p=>p[1]=="Volume")).slice(0,2);
 q.push(S(0,2,"Ces unités et ces appareils servent à mesurer la masse ou le volume ? Associe-les.",sh([...ms,...vs]).map(p=>({l:p[0][0].toUpperCase()+p[0].slice(1),c:p[1]})),["Masse","Volume"],"Masse : balance ; mg, g, kg. Volume : éprouvette graduée ; mL, cL, L."));
 q.push(C(1,1,"Où doit-on placer son œil pour mesurer le volume d’un liquide dans une éprouvette graduée ?","À la hauteur de la surface du liquide, en lisant le bas du ménisque",["Au-dessus de l’éprouvette, en lisant le haut du liquide","En dessous de l’éprouvette, en lisant le haut du ménisque","N’importe où : cela ne change rien"],"On lit au bas du ménisque (la surface courbe du liquide), l’œil à la hauteur de cette surface."));
 const lo=R([20,30,40,50]),d=R([10,20]);
 q.push(N(1,1.5,`Sur une éprouvette, deux graduations chiffrées consécutives sont <b>${lo} mL</b> et <b>${lo+d} mL</b>. Il y a <b>10 divisions</b> entre ces deux chiffres. Calcule la valeur d’une division (en mL).`,d/10,dec(d/10)+" mL",`(${lo+d} − ${lo}) ÷ 10 = ${d} ÷ 10 = ${dec(d/10)} mL par division.`));
 const Lo=R([10,20,30]),st=R([10,20]),k=R([2,3,4,6,7]),e=epr(Lo,st,k);
 q.push(N(1,1.5,`Lis le volume de liquide contenu dans l’éprouvette (en mL).${e.svg}`,e.v,dec(e.v)+" mL",`Valeur d’une division : (${Lo+st} − ${Lo}) ÷ 10 = ${dec(st/10)} mL. Le bas du ménisque est ${k} divisions au-dessus de ${Lo+st} : ${Lo+st} + ${k} × ${dec(st/10)} = ${dec(e.v)} mL.`));
 const v1=R([40,50,60,70]),dv=R([5,6,7,8,9,12]),ob=R(["une clé en métal","une bille","un caillou","une barre d’acier"]);
 q.push(C(2,1,`Une éprouvette contient ${v1} mL d’eau. On y plonge ${ob} : le niveau monte à ${v1+dv} mL. Comment s’appelle la méthode utilisée pour mesurer le volume de l’objet ?`,"La méthode du déplacement d’eau",["La pesée par soustraction","La lecture du ménisque","La méthode de la balance"],"On mesure le volume d’un solide en regardant de combien le niveau de l’eau monte."));
 q.push(C(2,1.5,"Quelle formule permet de calculer le volume de l’objet ?","V<sub>objet</sub> = V<sub>final</sub> − V<sub>initial</sub>",["V<sub>objet</sub> = V<sub>initial</sub> − V<sub>final</sub>","V<sub>objet</sub> = V<sub>final</sub> + V<sub>initial</sub>","V<sub>objet</sub> = V<sub>final</sub> ÷ V<sub>initial</sub>"],"Le volume de l’objet est la différence entre le volume final (eau + objet) et le volume initial (eau seule)."));
 q.push(A(2,1.5,`Calcule le volume de l’objet (rappel : ${v1} mL d’eau au départ, ${v1+dv} mL avec l’objet). Donne le résultat avec son unité.`,dv,"mL",`V<sub>objet</sub> = ${v1+dv} mL − ${v1} mL = ${dv} mL.`));
 q.push(C(3,1.5,"Un élève affirme : « 1 verre plein de 150 mL pèse toujours 150 g, quel que soit l’ingrédient. » Que penses-tu de cette affirmation ?","Faux : le verre mesure un volume ; la masse dépend de l’ingrédient",["Vrai : 150 mL correspondent toujours à 150 g","Faux : le verre mesure une masse, pas un volume","Vrai : la masse et le volume sont la même grandeur"],"Le verre mesure la place occupée (volume), pas la quantité de matière (masse). 150 mL d’eau pèsent 150 g, mais pas 150 mL de farine."));
 const ig=R([["farine",100],["sucre",140]]),nv=R([2,3,4]);
 q.push(N(3,1,`Un verre plein de 150 mL de ${ig[0]} pèse ${ig[1]} g. Quelle est la masse de ${ig[0]} (en g) dans ${nv} verres pleins ?`,nv*ig[1],`${nv*ig[1]} g`,`${nv} × ${ig[1]} g = ${nv*ig[1]} g.`));
 q.push(C(3,1.5,"100 g de farine occupent 150 mL et 100 g de riz occupent 100 mL. Quel ingrédient occupe le plus de place ?","La farine",["Le riz","Les deux occupent la même place","On ne peut pas le savoir"],"150 mL > 100 mL : pour la même masse, la farine occupe un plus grand volume."));
 const CH=[["Fusion","Solide → Liquide"],["Solidification","Liquide → Solide"],["Vaporisation","Liquide → Gaz"],["Liquéfaction","Gaz → Liquide"],["Sublimation","Solide → Gaz"],["Condensation","Gaz → Solide"]];
 q.push(S(4,2,"Donne le nom de chaque changement d’état.",sh(CH).slice(0,4).map(c=>({l:c[1],c:c[0]})),sh(CH.map(c=>c[0])),"Fusion (S→L), solidification (L→S), vaporisation (L→G), liquéfaction (G→L), sublimation (S→G), condensation (G→S)."));
 const SC=R([["Un glaçon chauffe dans la poêle et devient de l’eau.","Fusion"],["De l’eau liquide mise au congélateur devient un glaçon.","Solidification"],["L’eau d’une casserole bout et s’échappe en vapeur.","Vaporisation"],["La vapeur d’eau forme des gouttes sous le couvercle froid.","Liquéfaction"]]);
 q.push(C(4,1,`${SC[0]} Quel est le nom du changement d’état ?`,SC[1],sh(CH.map(c=>c[0]).filter(n=>n!=SC[1])).slice(0,3),`C’est la ${SC[1].toLowerCase()} : ${CH.find(c=>c[0]==SC[1])[1]}.`));
 q.push(C(4,1,"Le « brouillard » blanc que l’on voit au-dessus d’une poêle chaude est :","de minuscules gouttes d’eau liquide",["de la vapeur d’eau à l’état gazeux","de petits morceaux de glace","de l’air chaud"],"La vapeur d’eau chaude rencontre l’air plus froid et se liquéfie : on voit de fines gouttelettes d’eau liquide, pas un gaz."));
 return q;
}
function pn(s){s=String(s).replace(/[\s\u00a0\u202f]/g,"").replace(",",".");if(!s)return NaN;return Number(s)}
function sc(q,a){
 if(q.t=="c")return a===q.ans?q.pts:0;
 if(q.t=="s")return q.items.reduce((s,it,j)=>s+(a[j]===it.c?q.pts/q.items.length:0),0);
 if(q.t=="n")return Math.abs(pn(a)-q.val)<1e-9?q.pts:0;
 return (Math.abs(pn(a.v)-q.val)<1e-9?q.pts-0.5:0)+(a.u===q.u?0.5:0);
}
const DUR=2400;let qs,ans,t0,tid,conf;
const hist=()=>{try{return JSON.parse(localStorage.getItem("anfal_pc_h")||"[]")}catch(e){return[]}};
const save=r=>{try{localStorage.setItem("anfal_pc_h",JSON.stringify([...hist(),r].slice(-10)))}catch(e){}};
function intro(){
 const h=hist();
 $("#app").innerHTML=`<main><h1>Examen blanc<br>Physique-Chimie</h1><p class="sm">Pour Anfal · 5<sup>e</sup> · Masse, volume et changements d’état</p>
 <div class="card"><h3>Comme en classe</h3><ul><li>Durée : <b>40 minutes</b>. Quand le temps est écoulé, la copie est rendue automatiquement.</li><li>15 questions sur <b>20 points</b>, en 5 parties de 4 points : définitions, lecture de graduation, déplacement d’eau, masse et volume au quotidien, changements d’état.</li><li>Sans cours. Garde un brouillon et une calculatrice simple si ta prof l’autorise.</li><li>Pour les calculs, écris le résultat avec son <b>unité</b> quand on te la demande.</li><li>À la fin : ta note, ton score en % par partie, et la correction détaillée.</li><li>Les nombres et les situations changent à chaque tentative.</li></ul></div>
 ${h.length?`<div class="card"><h3>Tes tentatives</h3>${h.map((r,i)=>`<div class="row"><span>Tentative ${i+1} · ${r.d}</span><span>${dec(r.s)}/20</span></div>`).join("")}</div>`:""}
 <button onclick="start()">Commencer l’examen</button></main>`;
}
function start(){qs=gen();ans=qs.map(q=>q.t=="s"?Array(q.items.length).fill(""):q.t=="a"?{v:"",u:""}:q.t=="n"?"":null);conf=false;t0=Date.now();clearInterval(tid);tid=setInterval(tick,500);exam();window.scrollTo(0,0)}
function exam(){
 let last=-1,html="";
 qs.forEach((q,i)=>{
  if(q.part!==last){last=q.part;const mx=qs.filter(x=>x.part==q.part).reduce((a,x)=>a+x.pts,0);html+=`<h2 style="margin-top:28px">Partie ${"ABCDE"[q.part]} : ${PARTS[q.part]} <span class="pt">${dec(mx)} pts</span></h2>`}
  html+=`<div class="q"><div class="h"><span>Question ${i+1}</span><span class="pt">${dec(q.pts)} pt${q.pts>1?"s":""}</span></div><div>${q.html}</div>`+
  (q.t=="c"?q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" onchange="ans[${i}]=${j};prog()">${o}</label>`).join(""):
   q.t=="s"?q.items.map((it,j)=>`<div class="it"><span>${it.l}</span><select aria-label="Réponse ${j+1}" onchange="ans[${i}][${j}]=this.value;prog()"><option value="">— choisir —</option>${q.opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`).join(""):
   q.t=="n"?`<div class="it"><input type="text" inputmode="decimal" aria-label="Réponse" autocomplete="off" oninput="ans[${i}]=this.value;prog()"></div>`:
   `<div class="it"><input type="text" inputmode="decimal" aria-label="Valeur" autocomplete="off" oninput="ans[${i}].v=this.value;prog()"><select aria-label="Unité" onchange="ans[${i}].u=this.value;prog()"><option value="">unité</option>${["mL","L","g","kg"].map(o=>`<option>${o}</option>`).join("")}</select></div>`)+`</div>`;
 });
 $("#app").innerHTML=`<header class="bar"><div><b>Examen blanc · Physique-Chimie</b><div class="sm" id="pg"></div></div><div id="clk">40:00</div></header><main>${html}<div id="msg" role="status"></div><button onclick="sub()">Rendre ma copie</button></main>`;
 prog();tick();
}
const blank=(q,a)=>q.t=="c"?a===null:q.t=="s"?a.some(x=>x===""):q.t=="n"?a.trim()==="":a.v.trim()===""||a.u==="";
const miss=()=>qs.filter((q,i)=>blank(q,ans[i])).length;
function prog(){conf=false;const e=$("#msg");if(e)e.textContent="";$("#pg").textContent=`${qs.length-miss()} / ${qs.length} questions complètes`}
function tick(){const l=Math.max(0,DUR-Math.floor((Date.now()-t0)/1000));const c=$("#clk");if(!c)return;c.textContent=String(Math.floor(l/60)).padStart(2,"0")+":"+String(l%60).padStart(2,"0");c.className=l<=300?"w":"";if(l<=0)finish(true)}
function sub(){if(miss()>0&&!conf){conf=true;$("#msg").textContent=`Il reste ${miss()} question(s) incomplète(s). Appuie encore sur « Rendre ma copie » pour confirmer.`;return}finish(false)}
const esc=s=>String(s).replace(/[&<>]/g,"");
function finish(auto){
 clearInterval(tid);
 const used=Math.min(DUR,Math.floor((Date.now()-t0)/1000));
 const ea=qs.map((q,i)=>sc(q,ans[i]));
 const got=[0,0,0,0,0],mx=[0,0,0,0,0];
 qs.forEach((q,i)=>{mx[q.part]+=q.pts;got[q.part]+=ea[i]});
 const s=got.reduce((a,b)=>a+b,0),pc=got.map((g,i)=>Math.round(100*g/mx[i]));
 const h=hist(),prev=h.length?h[h.length-1].s:null;
 save({d:new Date().toLocaleDateString("fr-FR"),s,pc});
 const col=p=>p>=80?"var(--ok)":p>=50?"var(--wn)":"var(--ko)";
 const lab=p=>p>=80?"Solide":p>=50?"Presque, à consolider":"À revoir en priorité";
 const weak=pc.map((p,i)=>i).filter(i=>pc[i]<80).sort((a,b)=>pc[a]-pc[b]);
 $("#app").innerHTML=`<main><h1>Ta copie corrigée</h1>
 ${auto?`<p style="color:var(--ko);font-weight:800">Temps écoulé : la copie a été rendue automatiquement.</p>`:""}
 <div class="card"><div class="big">${dec(s)}<span style="font-size:32px">/20</span></div><h3 style="margin-top:6px">${MEN(s)}</h3>
 <p class="sm">Temps utilisé : ${Math.floor(used/60)} min ${used%60} s${prev!==null?` · Tentative précédente : ${dec(prev)}/20 (${s-prev>=0?"+":""}${dec(Math.round((s-prev)*10)/10)})`:""}</p></div>
 <h2>Ton score par partie</h2>
 ${pc.map((p,i)=>`<div class="card" style="margin:10px 0"><div class="row"><span>${PARTS[i]}</span><span style="color:${col(p)}">${p} %</span></div><div class="bar2"><b style="width:${p}%;background:${col(p)}"></b></div><div class="sm">${dec(got[i])}/${dec(mx[i])} pts · ${lab(p)}</div></div>`).join("")}
 <div class="card"><h3>Ce qu’il faut retravailler</h3>${weak.length?`<ul>${weak.map(i=>`<li><b>${PARTS[i]}</b> (${pc[i]} %) : ${TIPS[i]}</li>`).join("")}</ul>`:`<p>Toutes les parties sont solides. Bravo !</p>`}</div>
 <h2>Correction détaillée</h2>
 ${qs.map((q,i)=>{const e=ea[i],cl=e>=q.pts?"good":e>0?"mid":"bad",a=ans[i];let b;
  if(q.t=="c")b=`<div class="sm">Ta réponse : ${a===null?"(pas de réponse)":q.opts[a]}</div>${e?"":`<div>Bonne réponse : <b>${q.show}</b></div>`}`;
  else if(q.t=="s")b=q.items.map((it,j)=>{const o=a[j]===it.c;return `<div>${o?"✓":"✗"} ${it.l} : ${a[j]||"(pas de réponse)"}${o?"":` → <b>${it.c}</b>`}</div>`}).join("");
  else if(q.t=="n")b=`<div class="sm">Ta réponse : ${a.trim()?esc(a):"(pas de réponse)"}</div>${e?"":`<div>Bonne réponse : <b>${q.show}</b></div>`}`;
  else b=`<div class="sm">Ta réponse : ${a.v.trim()?esc(a.v)+" "+a.u:"(pas de réponse)"}</div>${e>=q.pts?"":`<div>Bonne réponse : <b>${q.show}</b></div>`}`;
  return `<div class="q ${cl}"><div class="h"><span>Question ${i+1}</span><span class="pt">${dec(e)}/${dec(q.pts)}</span></div><div>${q.html.replace(/<svg[\s\S]*<\/svg>/,"")}</div>${b}<div class="ex">${q.expl}</div></div>`}).join("")}
 <button onclick="start()">Refaire un examen (nouvelles questions)</button> <button class="alt" onclick="intro()">Accueil</button></main>`;
 window.scrollTo(0,0);
}
intro();
</script>
</body>
